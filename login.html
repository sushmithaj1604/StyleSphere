
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Style Atelier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f3ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #9b6b55;
        }

        h2 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #9b6b55;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #79513f;
        }

        a {
            color: #9b6b55;
            text-decoration: none;
        }

        .notice {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Style Atelier</h1>

        <h2>Welcome Back!</h2>

        <form data-auth-form="login">

            <input
                type="email"
                name="email"
                placeholder="Enter Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">Login</button>

            <p class="notice"></p>

        </form>

        <p>Don't have an account?
            <a href="register.html">Register Here</a>
        </p>

        <p>
            <a href="index.html">Back to Home</a>
        </p>

    </div>

    <script src="js/main.js"></script>

</body>
</html>
